<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Квиз: Чому ваше авто не продається?</title>
<style>
  body { font-family: Arial, sans-serif; background: #f7f7f7; margin:0; padding:20px;}
  .quiz { max-width: 600px; margin: auto; background: #fff; padding: 20px; border-radius: 10px; box-shadow:0 0 10px rgba(0,0,0,0.1);}
  .quiz__question { font-size: 18px; margin-bottom: 15px; }
  .quiz__answers button { display:block; width:100%; margin:5px 0; padding:10px; font-size:16px; border:none; border-radius:5px; cursor:pointer; background:#e0e0e0; }
  .quiz__answers button:hover { background:#ccc; }
  .quiz__progress { margin-bottom:10px; font-size:14px; color:#555; }
  .quiz__result { display:none; }
</style>
</head>
<body>

<div class="quiz" id="quiz">
  <div class="quiz__progress" id="quizProgress">Питання 1 з 10</div>
  <div class="quiz__question" id="quizQuestion"></div>
  <div class="quiz__answers" id="quizAnswers"></div>
  <div class="quiz__result" id="quizResult"></div>
</div>

<script>
const quizData = {
  "scenarios": { "S1":"price","S2":"presentation","S3":"trust","S4":"process" },
  "questions":[
    {"id":"q1_car","type":"car_input","required":true,"affectsScore":false,"text":"Розкажіть трохи про авто, яке ви хочете продати","fields":[{"id":"make","label":"Марка","type":"text","required":true},{"id":"model","label":"Модель","type":"text","required":true},{"id":"year","label":"Рік випуску","type":"number","required":true,"min":1980,"max":2026}]},
    {"id":"q2_listed_for","type":"single","required":true,"affectsScore":true,"text":"Як давно ваше авто виставлене на продаж?","answers":[{"id":"lt_2w","label":"Менше 2 тижнів","weights":{"S4":1}},{"id":"2_4w","label":"2–4 тижні","weights":{"S2":1,"S1":1}},{"id":"1_2m","label":"1–2 місяці","weights":{"S1":2,"S2":1}},{"id":"gt_2m","label":"Більше 2 місяців","weights":{"S1":2,"S4":1}}]},
    {"id":"q3_contacts","type":"single","required":true,"affectsScore":true,"text":"Скільки реальних дзвінків або повідомлень ви отримали?","answers":[{"id":"none","label":"Майже немає","weights":{"S1":3,"S2":1}},{"id":"1_2wk","label":"1–2 на тиждень","weights":{"S1":2,"S2":1}},{"id":"contact_no_result","label":"Дзвонять, але без результату","weights":{"S3":2,"S4":1}},{"id":"many_no_deal","label":"Дзвінків достатньо, але угоди немає","weights":{"S3":2,"S4":2}}]},
    {"id":"q4_price_set","type":"single","required":true,"affectsScore":true,"text":"Як ви визначали ціну на авто?","answers":[{"id":"like_ads","label":"Подивився(лась) схожі оголошення і поставив(ла) свою","weights":{"S1":2}},{"id":"desired_sum","label":"Орієнтувався(лась) на бажану суму","weights":{"S1":3}},{"id":"with_haggle","label":"З урахуванням торгу","weights":{"S1":2,"S4":1}},{"id":"already_lowered","label":"Вже кілька разів знижував(ла)","weights":{"S1":2,"S2":1}}]},
    {"id":"q5_photos","type":"single","required":true,"affectsScore":true,"text":"Як би ви оцінили фото в оголошенні?","answers":[{"id":"basic_phone","label":"Звичайні, зроблені на телефон","weights":{"S2":2}},{"id":"ok_no_prep","label":"Фото є, але без підготовки","weights":{"S2":3}},{"id":"honest_full","label":"Намагався(лась) показати все чесно","weights":{"S3":1,"S2":1}},{"id":"not_sure","label":"Не впевнений(а), що фото достатньо хороші","weights":{"S2":3}}]},
    {"id":"q6_description","type":"single","required":true,"affectsScore":true,"text":"Опис авто — це скоріше…","answers":[{"id":"few_lines","label":"Кілька рядків “по суті”","weights":{"S2":2}},{"id":"detailed_no_structure","label":"Детальний опис, але без структури","weights":{"S2":2,"S3":1}},{"id":"honest_pros_cons","label":"Чесний опис з плюсами і мінусами","weights":{"S3":2}},{"id":"dont_know","label":"Важко сказати, що ще додати","weights":{"S2":2}}]},
    {"id":"q7_communication","type":"single","required":true,"affectsScore":true,"text":"Як ви зазвичай спілкуєтесь з потенційними покупцями?","answers":[{"id":"when_time","label":"Відповідаю, коли є час","weights":{"S4":3}},{"id":"fast_try","label":"Намагаюся відповідати швидко","weights":{"S4":1}},{"id":"repeat_same","label":"Часто доводиться пояснювати одне й те саме","weights":{"S4":2,"S2":1}},{"id":"people_disappear","label":"Частина людей просто зникає","weights":{"S3":2,"S4":1}}]},
    {"id":"q8_tech_history_questions","type":"single","required":true,"affectsScore":true,"text":"Чи запитують покупці про технічний стан або історію авто?","answers":[{"id":"often","label":"Так, і часто","weights":{"S3":3}},{"id":"sometimes","label":"Іноді","weights":{"S3":2}},{"id":"rare","label":"Рідко","weights":{"S1":1,"S2":1}},{"id":"i_tell_first","label":"Я сам(а) про це одразу розповідаю","weights":{"S3":1}}]},
    {"id":"q9_hardest_part","type":"single","required":true,"affectsScore":true,"text":"Що для вас зараз найскладніше у продажу авто?","answers":[{"id":"no_result_reason","label":"Зрозуміти, чому немає результату","weights":{"S1":2,"S2":1}},{"id":"calls_messages","label":"Постійні дзвінки і переписка","weights":{"S4":3}},{"id":"no_trust","label":"Недовіра з боку покупців","weights":{"S3":3}},{"id":"no_time","label":"Немає часу займатись цим процесом","weights":{"S4":3}}]},
    {"id":"q10_expectation","type":"single","required":true,"affectsScore":false,"text":"Що ви очікуєте від цього тесту?","answers":[{"id":"understand_reason","label":"Хочу зрозуміти, у чому причина"},{"id":"useful_tips","label":"Хочу отримати корисні поради"},{"id":"consider_help","label":"Розглядаю допомогу професіоналів"},{"id":"just_curiosity","label":"Просто цікаво"}]}
  ]
};

let currentQuestion = 0;
let scores = {S1:0, S2:0, S3:0, S4:0};
let answersSelected = {};

function renderQuestion() {
  const q = quizData.questions[currentQuestion];
  const containerQ = document.getElementById('quizQuestion');
  const containerA = document.getElementById('quizAnswers');
  document.getElementById('quizProgress').textContent = `Питання ${currentQuestion+1} з ${quizData.questions.length}`;

  containerQ.innerHTML = q.text;
  containerA.innerHTML = '';

  // car_input
  if (q.type === 'car_input') {
    q.fields.forEach(f=>{
      const input = document.createElement('input');
      input.placeholder = f.label;
      input.type = f.type==='number'? 'number':'text';
      input.min = f.min || null;
      input.max = f.max || null;
      input.required = f.required;
      input.style.display='block';
      input.style.marginBottom='10px';
      containerA.appendChild(input);
    });
    const btn = document.createElement('button');
    btn.textContent = 'Далі';
    btn.onclick = ()=>{
      const inputs = containerA.querySelectorAll('input');
      let valid = true;
      inputs.forEach((i,fidx)=>{ if(!i.value){ valid=false;} else { answersSelected[q.fields[fidx].id]=i.value;} });
      if(!valid){ alert('Заповніть всі поля'); return;}
      nextQuestion();
    }
    containerA.appendChild(btn);
  } else {
    q.answers.forEach(a=>{
      const btn = document.createElement('button');
      btn.textContent = a.label;
      btn.onclick = ()=>{ selectAnswer(q,a); }
      containerA.appendChild(btn);
    });
  }
}

function selectAnswer(q,a){
  answersSelected[q.id] = a.id;
  if(q.affectsScore){
    for(const s in a.weights){
      scores[s] += a.weights[s];
    }
  }
  nextQuestion();
}

function nextQuestion(){
  currentQuestion++;
  if(currentQuestion<quizData.questions.length){
    renderQuestion();
  } else {
    finishQuiz();
  }
}

function finishQuiz(){
  // ищем топ и второй сценарий
  const sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  let topScenario = sorted[0][0];
  let secondScenario = sorted[1][0];

  // тай-брейк по Q9 если есть равенство
  const q9 = quizData.questions.find(q=>q.id==='q9_hardest_part');
  const q9answer = answersSelected['q9_hardest_part'];
  const q9weights = q9.answers.find(a=>a.id===q9answer).weights;
  const maxScore = Math.max(...Object.values(scores));
  const tieScenarios = Object.keys(scores).filter(k=>scores[k]===maxScore);
  if(tieScenarios.length>1){
    // берем сценарий из Q9 если есть
    const q9Sorted = Object.entries(q9weights).sort((a,b)=>b[1]-a[1]);
    topScenario = q9Sorted[0][0];
  }

  console.log('Результати квиза:');
  console.log('Вибрані відповіді:', answersSelected);
  console.log('Бали по сценаріям:', scores);
  console.log('Top scenario:', topScenario);
  console.log('Second scenario:', secondScenario);

  const container = document.getElementById('quiz');
  container.innerHTML = `<div class="quiz__result"><h3>Квіз завершено!</h3><p>Top scenario: ${topScenario}</p><p>Second scenario: ${secondScenario}</p><pre>${JSON.stringify(answersSelected,null,2)}</pre></div>`;
}

renderQuestion();
</script>

</body>
</html>
