<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квиз: Яке авто вам підходить?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .quiz {
      max-width: 520px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .quiz__progress {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .quiz__question {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .quiz__answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz__answer {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: all .2s ease;
      font-size: 16px;
    }

    .quiz__answer:hover {
      border-color: #2c2d43;
      background: #f0f0f0;
    }

    .quiz__answer.selected {
      border-color: #2c2d43;
      background: #2c2d43;
      color: #fff;
    }

    .quiz__footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz__btn {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .quiz__btn--next {
      background: #2c2d43;
      color: #fff;
    }

    .quiz__btn--next:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .quiz__btn--back {
      background: transparent;
      color: #555;
    }

    /* RESULT */
    .result {
      display: none;
      text-align: center;
    }

    .result__title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .result__text {
      font-size: 16px;
      margin-bottom: 24px;
    }

    .result__cta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result__btn {
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
    }

    .result__btn--primary {
      background: #2c2d43;
      color: #fff;
    }

    .result__btn--secondary {
      background: #f0f0f0;
    }

    /* MOBILE UX */
    @media (max-width: 480px) {
      body {
        background: #fff;
      }

      .quiz {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        padding: 20px 16px 24px;
        box-shadow: none;
        /* display: flex; */
        flex-direction: column;
      }

      .quiz__progress {
        font-size: 13px;
        margin-bottom: 8px;
      }

      .quiz__question {
        font-size: 18px;
        margin-bottom: 16px;
      }

      .quiz__answers {
        gap: 10px;
      }

      .quiz__answer {
        font-size: 15px;
        padding: 14px 14px;
      }

      .quiz__footer {
        /* margin-top: auto; */
        gap: 12px;
        display: flex;
      }

      .quiz__btn {
        flex: 1;
        padding: 14px 0;
        font-size: 15px;
      }

      .result {
        min-height: 100vh;
        border-radius: 0;
        padding: 32px 16px;
      }

      .result__title {
        font-size: 20px;
      }

      .result__text {
        font-size: 15px;
      }

      .result__btn {
        font-size: 15px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- QUIZ -->
  <div class="quiz" id="quiz">
    <div class="quiz__progress" id="quizProgress">Питання 1 з 10</div>
    <div class="quiz__question" id="quizQuestion"></div>
    <div class="quiz__answers" id="quizAnswers"></div>
    <div class="quiz__footer">
      <button class="quiz__btn quiz__btn--back" id="btnBack">Назад</button>
      <button class="quiz__btn quiz__btn--next" id="btnNext" disabled>Далі</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="quiz result" id="result">
    <div class="result__title" id="resultTitle"></div>
    <div class="result__text" id="resultText"></div>
    <div class="result__cta">
      <button class="result__btn result__btn--primary" id="ctaPrimary">🔍 Перейти в AutoRia</button>
      <button class="result__btn result__btn--secondary" id="ctaSecondary">📞 Отримати консультацію менеджера</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Quiz script loaded');

      const REFERRER = 'buyer quiz which car';
      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxs19k8Z2wRcuk4WSvGg3WAY6_ozQu0zeBIBcEvKxFZFo6DTvCZrxlNHGguXECgjH-W/exec';
      let ctaClicked = false;

      const urlParams = new URLSearchParams(window.location.search);
      const utm_source = urlParams.get('utm_source') || '';
      const utm_medium = urlParams.get('utm_medium') || '';
      const utm_campaign = urlParams.get('utm_campaign') || '';
      const utm_content = urlParams.get('utm_content') || '';
      const utm_term = urlParams.get('utm_term') || '';

      const ARCHETYPE_MAP = {
        A: { brand: 'Toyota', model: 'Corolla', text: 'надійний та практичний варіант для щоденного використання' },
        B: { brand: 'Volkswagen', model: 'Golf', text: 'збалансований автомобіль для сімʼї та міста' },
        C: { brand: 'BMW', model: '3 Series', text: 'динамічний автомобіль для тих, хто любить драйв' },
        D: { brand: 'Subaru', model: 'Forester', text: 'ідеальний для подорожей та активного способу життя' },
        E: { brand: 'Skoda', model: 'Octavia', text: 'раціональний вибір з максимумом користі' }
      };

      const quizConfig = {
        questions: [
          {
            id: 'q1', text: 'Якщо уявити ваш ідеальний автомобіль як тварину — хто це?', answers: [
              { id: 'cat', label: '🐱 Кіт', weights: { A: 3, C: 1 } },
              { id: 'dog', label: '🐕 Пес', weights: { B: 3, D: 1 } },
              { id: 'cheetah', label: '🐆 Гепард', weights: { C: 3, A: 1 } },
              { id: 'bear', label: '🐻 Ведмідь', weights: { D: 3, B: 1 } },
              { id: 'fox', label: '🦊 Лис', weights: { E: 3, A: 1 } }
            ]
          },
          {
            id: 'q2', text: 'Ваш ідеальний вихідний — це…', answers: [
              { id: 'city', label: 'Місто + кава', weights: { A: 2 } },
              { id: 'nature', label: 'Природа / за місто', weights: { D: 2 } },
              { id: 'home', label: 'Дім, затишок', weights: { B: 2 } },
              { id: 'trip', label: 'Спонтанна подорож', weights: { C: 2 } },
              { id: 'planned', label: 'Все сплановано', weights: { E: 2 } }
            ]
          },
          {
            id: 'q3', text: 'Авто для вас — це…', answers: [
              { id: 'transport', label: 'Просто транспорт', weights: { E: 2 } },
              { id: 'assistant', label: 'Помічник', weights: { B: 2 } },
              { id: 'style', label: 'Частина стилю', weights: { C: 2 } },
              { id: 'simplify', label: 'Спрощує життя', weights: { A: 2 } }
            ]
          },
          {
            id: 'q4', text: 'Коли щось ламається, ви…', answers: [
              { id: 'want_work', label: 'Хочу, щоб просто працювало', weights: { D: 2 } },
              { id: 'fix', label: 'Вирішую і забуваю', weights: { E: 2 } },
              { id: 'tolerate', label: 'Терплю', weights: { B: 1, A: 1 } },
              { id: 'control', label: 'Контролюю все', weights: { A: 2 } }
            ]
          },
          {
            id: 'q5', text: 'У дорозі важливіше…', answers: [
              { id: 'quiet', label: 'Тиша і плавність', weights: { A: 2 } },
              { id: 'safety', label: 'Відчуття безпеки', weights: { B: 2 } },
              { id: 'control_drive', label: 'Контроль і керування', weights: { C: 2 } },
              { id: 'reliability', label: 'Надійність', weights: { D: 2 } }
            ]
          },
          {
            id: 'q6', text: 'Паркування для вас — це…', answers: [
              { id: 'easy', label: 'Не проблема', weights: { A: 2 } },
              { id: 'usual', label: 'Звична справа', weights: { E: 2 } },
              { id: 'stress', label: 'Стрес', weights: { B: 1, D: 1 } },
              { id: 'depends', label: 'Залежить від ситуації', weights: { C: 2 } }
            ]
          },
          {
            id: 'q7', text: 'У багажнику частіше…', answers: [
              { id: 'nothing', label: 'Майже нічого', weights: { A: 2 } },
              { id: 'bags', label: 'Покупки', weights: { B: 2 } },
              { id: 'stuff', label: 'Речі “про всяк випадок”', weights: { D: 2 } },
              { id: 'hobby', label: 'Хобі / спорт', weights: { C: 2 } }
            ]
          },
          {
            id: 'q8', text: 'Коли вибір складний, ви…', answers: [
              { id: 'intuition', label: 'Інтуїтивно', weights: { C: 2 } },
              { id: 'ask', label: 'Раджусь', weights: { B: 2 } },
              { id: 'analyze', label: 'Довго аналізую', weights: { E: 2 } },
              { id: 'simple', label: 'Хочу просте рішення', weights: { A: 2 } }
            ]
          },
          {
            id: 'q9', text: 'Як ви водите?', answers: [
              { id: 'calm', label: 'Спокійно', weights: { A: 2, D: 1 } },
              { id: 'confident', label: 'Акуратно, впевнено', weights: { B: 2, A: 1 } },
              { id: 'love_drive', label: 'Люблю відчувати дорогу', weights: { C: 3 } },
              { id: 'varied', label: 'По-різному', weights: { E: 2 } }
            ]
          },
          {
            id: 'q10', text: 'Що для вас зараз важливіше у виборі авто?', answers: [
              { id: 'informational', label: 'Зрозуміти, що мені підходить' },
              { id: 'consideration', label: 'Порівнюю варіанти' },
              { id: 'decision', label: 'Хочу визначитись' },
              { id: 'awareness', label: 'Просто цікаво' }
            ]
          }
        ]
      };

      const state = { step: 0, answers: {}, score: { A: 0, B: 0, C: 0, D: 0, E: 0 }, result: {} };

      const quizEl = document.getElementById('quiz');
      const resultEl = document.getElementById('result');
      const progressEl = document.getElementById('quizProgress');
      const questionEl = document.getElementById('quizQuestion');
      const answersEl = document.getElementById('quizAnswers');
      const btnNext = document.getElementById('btnNext');
      const btnBack = document.getElementById('btnBack');

      const resultTitle = document.getElementById('resultTitle');
      const resultText = document.getElementById('resultText');
      const ctaPrimary = document.getElementById('ctaPrimary');
      const ctaSecondary = document.getElementById('ctaSecondary');

      function renderQuestion() {
        const q = quizConfig.questions[state.step];
        progressEl.textContent = `Питання ${state.step + 1} з ${quizConfig.questions.length}`;
        questionEl.textContent = q.text;
        answersEl.innerHTML = '';
        btnNext.disabled = true;

        q.answers.forEach(a => {
          const btn = document.createElement('button');
          btn.className = 'quiz__answer';
          btn.textContent = a.label;
          btn.onclick = () => {
            state.answers[q.id] = a.id;
            [...answersEl.children].forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            btnNext.disabled = false;
          };
          answersEl.appendChild(btn);
        });

        btnBack.style.visibility = state.step === 0 ? 'hidden' : 'visible';
      }

      function calculateResult() {
        state.score = { A: 0, B: 0, C: 0, D: 0, E: 0 };

        quizConfig.questions.forEach(q => {
          const answerId = state.answers[q.id];
          if (!answerId) return;

          const ans = q.answers.find(a => a.id === answerId);
          if (!ans || !ans.weights) return;

          Object.entries(ans.weights).forEach(([archetype, value]) => {
            state.score[archetype] += value;
          });
        });

        const sorted = Object.entries(state.score).sort((a, b) => b[1] - a[1]);
        const top = sorted[0][0];

        const map = ARCHETYPE_MAP[top];

        state.result = {
          archetype: top,
          brand: map.brand,
          model: map.model,
          description: map.text,
          intent: state.answers.q10 // intent_segment
        };

        console.log('🏁 FINAL RESULT:', {
          answers: state.answers,
          score: state.score,
          result: state.result
        });
      }

      function buildPayload(cta = '') {
        return {
          timestamp_iso: new Date().toISOString(),
          referrer: REFERRER,
          utm_source, utm_medium, utm_campaign, utm_content, utm_term,
          answers: state.answers,
          score: state.score,
          result: state.result,
          top2_archetype: state.result.top2_archetype,
          intent_segment: state.result.intent_segment,
          cta_clicked: cta
        };
      }

      async function sendPayload(payload) {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({
            payload: JSON.stringify(payload)
          })
        });
      }

      let isSubmittingFinal = false;
      btnNext.onclick = async () => {
        // обычные вопросы
        if (state.step < quizConfig.questions.length - 1) {
          state.step++;
          renderQuestion();
          return;
        }

        // ===== q10 (ФИНАЛ) =====
        if (isSubmittingFinal) return; // ⛔ защита от двойного клика
        isSubmittingFinal = true;

        btnNext.disabled = true;
        btnNext.textContent = 'Обробляємо...';

        calculateResult();

        resultTitle.textContent = `Вам найбільше підходить бренд ${state.result.brand}`;
        resultText.textContent = `Наприклад, ${state.result.brand} ${state.result.model} — ${state.result.description}.`;

        try {
          await sendPayload(buildPayload('quiz_complete'));
        } catch (e) {
          console.error('Send failed', e);
          isSubmittingFinal = false;
          btnNext.disabled = false;
          btnNext.textContent = 'Далі';
          return;
        }

        quizEl.style.display = 'none';
        resultEl.style.display = 'block';
      };


      btnBack.onclick = () => { if (state.step > 0) { state.step--; renderQuestion(); } };
      ctaPrimary.onclick = async () => { if (ctaClicked) return; ctaClicked = true; await sendPayload(buildPayload('autoria')); window.location.href = 'https://auto.ria.com/uk/dealers/autoxata/3634/'; };
      ctaSecondary.onclick = async () => { if (ctaClicked) return; ctaClicked = true; await sendPayload(buildPayload('consult')); alert('Менеджер звʼяжеться з вами'); };

      renderQuestion();
    });
  </script>



</body>
</html>
