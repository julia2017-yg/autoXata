<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Квиз: Яке авто вам підходить?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6f7;
      color: #222;
    }

    .quiz {
      max-width: 520px;
      margin: 40px auto;
      background: #fff;
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, .08);
    }

    .quiz__progress {
      font-size: 14px;
      color: #777;
      margin-bottom: 12px;
    }

    .quiz__question {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .quiz__answers {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .quiz__answer {
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid #ddd;
      background: #fff;
      cursor: pointer;
      text-align: left;
      transition: all .2s ease;
      font-size: 16px;
    }

    .quiz__answer:hover {
      border-color: #000;
      background: #f0f0f0;
    }

    .quiz__answer.selected {
      border-color: #000;
      background: #000;
      color: #fff;
    }

    .quiz__footer {
      margin-top: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz__btn {
      padding: 12px 18px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .quiz__btn--next {
      background: #000;
      color: #fff;
    }

    .quiz__btn--next:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .quiz__btn--back {
      background: transparent;
      color: #555;
    }

    /* RESULT */
    .result {
      display: none;
      text-align: center;
    }

    .result__title {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .result__text {
      font-size: 16px;
      margin-bottom: 24px;
    }

    .result__cta {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .result__btn {
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      border: none;
    }

    .result__btn--primary {
      background: #000;
      color: #fff;
    }

    .result__btn--secondary {
      background: #f0f0f0;
    }

    /* MOBILE UX */
    @media (max-width: 480px) {
      body {
        background: #fff;
      }

      .quiz {
        margin: 0;
        min-height: 100vh;
        border-radius: 0;
        padding: 20px 16px 24px;
        box-shadow: none;
        display: flex;
        flex-direction: column;
      }

      .quiz__progress {
        font-size: 13px;
        margin-bottom: 8px;
      }

      .quiz__question {
        font-size: 18px;
        margin-bottom: 16px;
      }

      .quiz__answers {
        gap: 10px;
      }

      .quiz__answer {
        font-size: 15px;
        padding: 14px 14px;
      }

      .quiz__footer {
        margin-top: auto;
        gap: 12px;
        display: flex;
      }

      .quiz__btn {
        flex: 1;
        padding: 14px 0;
        font-size: 15px;
      }

      .result {
        min-height: 100vh;
        border-radius: 0;
        padding: 32px 16px;
      }

      .result__title {
        font-size: 20px;
      }

      .result__text {
        font-size: 15px;
      }

      .result__btn {
        font-size: 15px;
        padding: 16px;
      }
    }
  </style>
</head>
<body>

  <!-- QUIZ -->
  <div class="quiz" id="quiz">
    <div class="quiz__progress" id="quizProgress">Питання 1 з 10</div>
    <div class="quiz__question" id="quizQuestion"></div>
    <div class="quiz__answers" id="quizAnswers"></div>
    <div class="quiz__footer">
      <button class="quiz__btn quiz__btn--back" id="btnBack">Назад</button>
      <button class="quiz__btn quiz__btn--next" id="btnNext" disabled>Далі</button>
    </div>
  </div>

  <!-- RESULT -->
  <div class="quiz result" id="result">
    <div class="result__title" id="resultTitle"></div>
    <div class="result__text" id="resultText"></div>
    <div class="result__cta">
      <button class="result__btn result__btn--primary" id="ctaPrimary">🔍 Перейти в AutoRia</button>
      <button class="result__btn result__btn--secondary" id="ctaSecondary">📞 Отримати консультацію менеджера</button>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      console.log('🚀 Quiz script loaded');

      // ===== CONFIG =====
      const REFERRER = 'buyer quiz which car';
      const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzuNAyigr_Q-mQZx_pz-3yWeYC4UYOE18YpSJfBQrp3Gz758w4SR-u1ZRXjsSRl78Gj/exec';
      let ctaClicked = false; // защита от повторных кликов

      // Получение UTM из URL
      const urlParams = new URLSearchParams(window.location.search);
      const utm_source = urlParams.get('utm_source') || '';
      const utm_medium = urlParams.get('utm_medium') || '';
      const utm_campaign = urlParams.get('utm_campaign') || '';
      const utm_content = urlParams.get('utm_content') || '';
      const utm_term = urlParams.get('utm_term') || '';

      const quizConfig = {
        questions: [
          { id: 'q1', text: 'Якщо уявити ваш ідеальний автомобіль як тварину — хто це?', answers: [{ id: 'cat', label: '🐱 Кіт', weights: { A: 3, C: 1 } }, { id: 'dog', label: '🐕 Пес', weights: { B: 3, D: 1 } }, { id: 'cheetah', label: '🐆 Гепард', weights: { C: 3, A: 1 } }] },
          { id: 'q2', text: 'Ваш ідеальний вихідний — це…', answers: [{ id: 'city', label: 'Місто + кава', weights: { A: 2 } }, { id: 'nature', label: 'Природа', weights: { D: 2 } }] },
          { id: 'q3', text: 'Авто для вас — це…', answers: [{ id: 'transport', label: 'Транспорт', weights: { E: 2 } }, { id: 'style', label: 'Стиль', weights: { C: 2 } }] },
          { id: 'q4', text: 'Коли щось ламається, ви…', answers: [{ id: 'fix_forget', label: 'Вирішую і забуваю', weights: { E: 2 } }, { id: 'control', label: 'Контролюю все', weights: { A: 2 } }] },
          { id: 'q5', text: 'У дорозі важливіше…', answers: [{ id: 'safe', label: 'Безпека', weights: { B: 2 } }, { id: 'feel', label: 'Керування', weights: { C: 2 } }] },
          { id: 'q6', text: 'Паркування для вас — це…', answers: [{ id: 'easy', label: 'Легко', weights: { A: 2 } }, { id: 'stress', label: 'Стрес', weights: { B: 1, D: 1 } }] },
          { id: 'q7', text: 'У багажнику частіше…', answers: [{ id: 'bags', label: 'Покупки', weights: { B: 2 } }, { id: 'hobby', label: 'Хобі', weights: { C: 2 } }] },
          { id: 'q8', text: 'Коли вибір складний, ви…', answers: [{ id: 'ask', label: 'Раджусь', weights: { B: 2 } }, { id: 'analyze', label: 'Аналізую', weights: { E: 2 } }] },
          { id: 'q9', text: 'Як ви водите?', answers: [{ id: 'careful', label: 'Акуратно', weights: { B: 2 } }, { id: 'sport', label: 'Динамічно', weights: { C: 3 } }] },
          { id: 'q10', text: 'Що для вас зараз важливіше?', answers: [{ id: 'awareness', label: 'Цікавість' }, { id: 'decision', label: 'Визначитись' }] }
        ]
      };

      // ===== STATE =====
      const state = { step: 0, answers: {}, score: { A: 0, B: 0, C: 0, D: 0, E: 0 }, result: {} };

      // ===== DOM =====
      const quizEl = document.getElementById('quiz');
      const resultEl = document.getElementById('result');
      const progressEl = document.getElementById('quizProgress');
      const questionEl = document.getElementById('quizQuestion');
      const answersEl = document.getElementById('quizAnswers');
      const btnNext = document.getElementById('btnNext');
      const btnBack = document.getElementById('btnBack');

      const resultTitle = document.getElementById('resultTitle');
      const resultText = document.getElementById('resultText');
      const ctaPrimary = document.getElementById('ctaPrimary');
      const ctaSecondary = document.getElementById('ctaSecondary');

      // ===== FUNCTIONS =====
      function renderQuestion() {
        const q = quizConfig.questions[state.step];
        console.log(`➡️ Render ${q.id}`);
        progressEl.textContent = `Питання ${state.step + 1} з ${quizConfig.questions.length}`;
        questionEl.textContent = q.text;
        answersEl.innerHTML = '';
        btnNext.disabled = true;

        q.answers.forEach(answer => {
          const btn = document.createElement('button');
          btn.className = 'quiz__answer';
          btn.textContent = answer.label;
          if (state.answers[q.id] === answer.id) { btn.classList.add('selected'); btnNext.disabled = false; }

          btn.onclick = () => {
            console.log(`✅ Selected ${q.id}: ${answer.id}`);
            state.answers[q.id] = answer.id;
            [...answersEl.children].forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            btnNext.disabled = false;
          };

          answersEl.appendChild(btn);
        });

        btnBack.style.visibility = state.step === 0 ? 'hidden' : 'visible';
      }

      function calculateResult() {
        console.log('🧮 Calculating result');
        state.score = { A: 0, B: 0, C: 0, D: 0, E: 0 };
        quizConfig.questions.forEach(q => {
          const ansId = state.answers[q.id];
          const ans = q.answers.find(a => a.id === ansId);
          if (!ans || !ans.weights) return;
          Object.entries(ans.weights).forEach(([k, v]) => state.score[k] += v);
        });
        console.log('📊 Score:', state.score);
        const sorted = Object.entries(state.score).sort((a, b) => b[1] - a[1]);
        state.result.top = sorted[0][0];
        state.result.top2 = sorted[1][0];
        state.result.intent = state.answers.q10;
        state.result.brand = 'Subaru'; // demo
        state.result.model = 'Forester'; // demo
        console.log('🏆 Result:', state.result);
      }

      function buildPayload(cta = '') {
        const payload = {
          timestamp_iso: new Date().toISOString(),
          referrer: REFERRER,
          utm_source, utm_medium, utm_campaign, utm_content, utm_term,
          ...state.answers,
          top_archetype: state.result.top,
          top2_archetype: state.result.top2,
          intent_segment: state.result.intent,
          result_brand: state.result.brand,
          result_model: state.result.model,
          cta_clicked: cta
        };
        console.log('📦 Payload:', payload);
        return payload;
      }

      async function sendPayload(payload) {
        try {
          const resp = await fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          const data = await resp.json();
          console.log('✅ Payload sent:', data);
        } catch (e) { console.error('❌ Error sending payload:', e); }
      }

      // ===== NAVIGATION =====
      btnNext.onclick = async () => {
        if (state.step < quizConfig.questions.length - 1) {
          state.step++; renderQuestion();
        } else {
          calculateResult();
          const payload = buildPayload('');
          await sendPayload(payload); // quiz_complete
          quizEl.style.display = 'none'; resultEl.style.display = 'block';
        }
      };

      btnBack.onclick = () => { if (state.step > 0) { state.step--; renderQuestion(); } };

      // ===== CTA =====
      ctaPrimary.onclick = async () => {
        if (ctaClicked) return; ctaClicked = true;
        console.log('👉 CTA Autoria');
        const payload = buildPayload('autoria');
        await sendPayload(payload);
        window.location.href = 'https://auto.ria.com/uk/dealers/autoxata/3634/'; // редирект
      };

      ctaSecondary.onclick = async () => {
        if (ctaClicked) return; ctaClicked = true;
        console.log('👉 CTA Consult');
        const payload = buildPayload('consult');
        await sendPayload(payload);
        alert('Менеджер зв\'яжеться з вами'); // можно заменить на форму
      };

      // ===== INIT =====
      renderQuestion();
    });
  </script>


</body>
</html>
