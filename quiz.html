  <script>
    (function () {
      const utmKeys = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content'];

      // Получить текущие UTM
      const params = new URLSearchParams(window.location.search);
      const utms = {};
      utmKeys.forEach(k => {
        if (params.has(k)) utms[k] = params.get(k);
      });

      // Сохраняем UTM в localStorage при заходе
      if (Object.keys(utms).length > 0) {
        localStorage.setItem('utmParams', JSON.stringify(utms));
      }

      // Функция для добавления UTM ко всем ссылкам
      function appendUTMToLinks() {
        const savedUtms = JSON.parse(localStorage.getItem('utmParams') || '{}');
        if (Object.keys(savedUtms).length === 0) return;

        document.querySelectorAll('a[href]').forEach(link => {
          const href = link.getAttribute('href');
          if (!href || href.startsWith('#') || href.startsWith('mailto:') || href.startsWith('tel:')) return;
          // работаем только с локальными ссылками
          if (href.startsWith('/') || href.startsWith(window.location.origin)) {
            const url = new URL(href, window.location.origin);
            for (let k in savedUtms) {
              if (!url.searchParams.has(k)) url.searchParams.set(k, savedUtms[k]);
            }
            link.setAttribute('href', url.toString());
          }
        });
      }

      document.addEventListener('DOMContentLoaded', appendUTMToLinks);
    })();
  </script>

      function renderQuestion() {
        const q = quizConfig.questions[state.step];
        progressEl.textContent = `Питання ${state.step + 1} з ${quizConfig.questions.length}`;
        questionEl.textContent = q.text;

        // } else {

        answersEl.innerHTML = '';
        btnNext.disabled = true;

        q.answers.forEach(a => {
          const btn = document.createElement('button');
          btn.className = 'quiz__answer';
          btn.textContent = a.label;
          btn.onclick = () => {
            state.answers[q.id] = a.id;
            [...answersEl.children].forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            btnNext.disabled = false;
          };
          answersEl.appendChild(btn);
        });

        btnBack.style.visibility = state.step === 0 ? 'hidden' : 'visible';
      }

      function calculateResult() {
        state.score = { A: 0, B: 0, C: 0, D: 0, E: 0 };

        quizConfig.questions.forEach(q => {
          const answerId = state.answers[q.id];
          if (!answerId) return;

          const ans = q.answers.find(a => a.id === answerId);
          if (!ans || !ans.weights) return;

          Object.entries(ans.weights).forEach(([archetype, value]) => {
            state.score[archetype] += value;
          });
        });

        const sorted = Object.entries(state.score).sort((a, b) => b[1] - a[1]);
        const top = sorted[0][0];

        const map = ARCHETYPE_MAP[top];

        state.result = {
          archetype: top,
          brand: map.brand,
          model: map.model,
          description: map.text,
          image: map.image,
          intent: state.answers.q10 // intent_segment

          timestamp_iso: new Date().toISOString(),
          referrer: REFERRER,
          utm_source, utm_medium, utm_campaign, utm_content, utm_term,
          answers: state.answers,
          score: state.score,
          result: state.result,
          top2_archetype: state.result.top2_archetype,
          intent_segment: state.result.intent_segment,
          cta_clicked: cta
        };
      }

      async function sendPayload(payload) {
        await fetch(APPS_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
          },
          body: new URLSearchParams({
            payload: JSON.stringify(payload)
          })
        });
      }

      let isSubmittingFinal = false;
      btnNext.onclick = async () => {
        // обычные вопросы
        if (state.step < quizConfig.questions.length - 1) {
          state.step++;
          renderQuestion();
          return;
        }

        // ===== q10 (ФИНАЛ) =====
        if (isSubmittingFinal) return; // ⛔ защита от двойного клика
        isSubmittingFinal = true;

        btnNext.disabled = true;
        btnNext.textContent = 'Обробляємо...';

        calculateResult();

        resultTitle.textContent = `Вам найбільше підходить бренд ${state.result.brand}`;
        resultText.textContent = `Наприклад, ${state.result.brand} ${state.result.model} — ${state.result.description}.`;
        const resultImage = document.getElementById('resultImage');
        resultImage.src = state.result.image;
        resultImage.alt = `${state.result.brand} ${state.result.model}`;

        try {
          await sendPayload(buildPayload('quiz_complete'));
        } catch (e) {
          console.error('Send failed', e);
          isSubmittingFinal = false;
          btnNext.disabled = false;
          btnNext.textContent = 'Далі';
          return;
        }

        quizEl.style.display = 'none';
        resultEl.style.display = 'block';
      };


      btnBack.onclick = () => { if (state.step > 0) { state.step--; renderQuestion(); } };
      ctaPrimary.onclick = async () => { if (ctaClicked) return; ctaClicked = true; await sendPayload(buildPayload('autoria')); window.location.href = 'https://auto.ria.com/uk/dealers/autoxata/3634/'; };
      ctaSecondary.onclick = async () => {
        if (ctaClicked) return; ctaClicked = true; await sendPayload(buildPayload('consult'));
        document.querySelector('.open-popup')?.click();
      };

      renderQuestion();
    });
  </script>

  <script src="./assets/js/popup.js" defer></script>
  <script src="./assets/js/form.js" defer></script>
  <script src="./assets/js/lang.js" defer></script>

</body>
